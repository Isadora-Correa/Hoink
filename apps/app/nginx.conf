server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml font/ttf;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

  # index.html e version.json nunca em cache: garantem que a versão publicada seja carregada.
  location ~* ^/(index\.html|version\.json|flutter_service_worker\.js)$ {
    add_header Cache-Control "no-cache" always;
  }

  location ~* \.(js|wasm|ttf|otf|png|svg|json)$ {
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  # Deep links (/lancamentos, /contas/...) são resolvidos pelo roteador do app.
  location / { try_files $uri $uri/ /index.html; }
}
