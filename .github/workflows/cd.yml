name: CD

# Executa após o CI concluir com sucesso na main, em tags de versão (v*) ou manualmente.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publicar imagens Docker (GHCR)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # necessário apenas para enviar imagens ao GitHub Container Registry
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Identificar versão
        id: meta
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; else VERSION="$(node -p "require('./package.json').version")+${SHA}"; fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "sha=$SHA"
            echo "version=$VERSION"
            echo "api_image=$REGISTRY/$OWNER/hoink-api"
            echo "web_image=$REGISTRY/$OWNER/hoink-web"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API — build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.api_image }}:latest
          labels: org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Front-end — build e push
        uses: docker/build-push-action@v6
        with:
          context: apps/app
          push: true
          build-args: |
            API_BASE_URL=${{ vars.API_PUBLIC_URL || 'http://localhost:3333' }}
            GIT_SHA=${{ steps.meta.outputs.sha }}
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.web_image }}:latest
          labels: org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Resumo
        run: |
          {
            echo "### Imagens publicadas — versão \`${{ steps.meta.outputs.version }}\`"
            echo "- \`${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.sha }}\`"
            echo "- \`${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Implantar
    needs: publish
    # O deploy só roda depois que a hospedagem for configurada (variável DEPLOY_ENABLED=true no repositório).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.WEB_PUBLIC_URL }}
    steps:
      - name: Disparar deploy (webhooks do provedor)
        env:
          API_DEPLOY_HOOK: ${{ secrets.API_DEPLOY_HOOK }}
          WEB_DEPLOY_HOOK: ${{ secrets.WEB_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          for hook in "$API_DEPLOY_HOOK" "$WEB_DEPLOY_HOOK"; do
            [[ -z "$hook" ]] && continue
            curl -fsS -X POST "$hook" > /dev/null
          done
          echo "Deploy solicitado para a versão ${{ needs.publish.outputs.version }}"

  verify:
    name: Verificar após o deploy
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar a nova versão no ar
        env:
          API_URL: ${{ vars.API_PUBLIC_URL }}
          WEB_URL: ${{ vars.WEB_PUBLIC_URL }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            commit=$(curl -fsS "$API_URL/version" | jq -r .commit || true)
            [[ "$commit" == "$SHA" ]] && break
            echo "Aguardando API ($i/60): no ar=$commit, esperado=$SHA"; sleep 10
          done
          [[ "$commit" == "$SHA" ]] || { echo "::error::A API publicada não está na versão $SHA"; exit 1; }
          curl -fsS "$API_URL/health" | jq -e '.status == "ok"'
          if [[ -n "${WEB_URL:-}" ]]; then
            curl -fsS "$WEB_URL/healthz"
            curl -fsS "$WEB_URL/version.json" | jq -e --arg sha "$SHA" '.commit == $sha'
          fi
          {
            echo "### Deploy verificado ✅"
            echo "- API: $API_URL — commit \`$SHA\`, health ok"
            [[ -n "${WEB_URL:-}" ]] && echo "- Web: $WEB_URL — commit \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
